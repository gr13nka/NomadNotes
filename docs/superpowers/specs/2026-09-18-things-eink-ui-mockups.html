<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NomadNotes: Things on e-ink</title>
<meta name="description" content="Wireframes for the Things-on-e-ink chrome redesign.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='45' font-family='Arial, sans-serif' font-size='38' font-weight='700' fill='%23fff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000; --paper:#fff; --muted:#808080;
    --title:19px; --body:13px; --caption:10px;
  }
  *{ box-sizing:border-box; }
  html{ background:var(--paper); }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 16px; }

  /* ---- page header ---- */
  header.page{ padding:48px 0 8px; }
  header.page h1{
    margin:0;
    font-size:clamp(22px, 4vw, 30px);
    font-weight:500;
    letter-spacing:-0.02em;
  }
  header.page p{
    margin:10px 0 0;
    color:var(--muted);
    font-size:15px;
  }

  /* ---- icon sprite ---- */
  .icon{
    width:16px; height:16px; display:block;
    color:var(--ink);
    stroke:var(--ink);
    fill:none;
    stroke-width:1.5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .icon.xs{ width:11px; height:11px; }
  .icon.sm{ width:13px; height:13px; }

  /* ---- frame grid ---- */
  .frames-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 420px));
    justify-content:center;
    gap:40px 28px;
    padding:36px 0 88px;
  }
  .frame-card{ display:flex; flex-direction:column; align-items:center; }
  .frame-card figcaption{
    margin-top:12px;
    font-size:13px;
    color:var(--muted);
    text-align:center;
  }

  .device-frame{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    background:var(--paper);
    border:1.5px solid var(--ink);
    overflow:hidden;
    font-size:var(--body);
    line-height:1.3;
  }

  /* ================= LIBRARY ================= */
  .library{ display:flex; height:100%; }
  .lib-sidebar{
    width:37%;
    min-width:130px;
    border-right:1px solid var(--ink);
    display:flex;
    flex-direction:column;
    padding:12px 8px 10px;
  }
  .find-field{
    display:flex; align-items:center; gap:6px;
    border:1.5px solid var(--ink);
    padding:5px 7px;
    margin-bottom:12px;
  }
  .find-field span{ color:var(--muted); font-size:12px; }
  .recent-row{ padding:5px 4px; }
  .hr{ height:1px; background:var(--ink); margin:6px 0; border:none; }
  .notebook-list{ display:flex; flex-direction:column; gap:1px; }
  .notebook-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 6px;
  }
  .notebook-row.selected{ background:var(--ink); color:var(--paper); }
  .notebook-row .count{ font-size:var(--caption); color:var(--muted); }
  .notebook-row.selected .count{ color:var(--paper); }
  .add-notebook{
    margin-top:auto;
    display:flex; align-items:center; gap:6px;
    padding-top:8px;
    border-top:1px solid var(--ink);
  }

  .lib-content{ flex:1; min-width:0; position:relative; padding:12px 14px 14px; }
  .lib-content-head{ display:flex; justify-content:space-between; align-items:flex-start; }
  .lib-title{ font-size:var(--title); font-weight:600; }
  .lib-caption{ margin-top:2px; font-size:var(--caption); color:var(--muted); }
  .icon-btn{
    background:none; border:0; padding:3px;
    display:inline-flex; align-items:center; justify-content:center;
    color:var(--ink); font:inherit;
  }
  .icon-btn.active{ background:var(--ink); }
  .icon-btn.active .icon{ color:var(--paper); stroke:var(--paper); }

  .thumb-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:9px;
    margin-top:16px;
  }
  .thumb{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .thumb .box{ width:100%; aspect-ratio:3/4; border:1.5px solid var(--ink); }
  .thumb .num{ font-size:var(--caption); color:var(--muted); }
  .thumb-plus .box{
    border:1.5px dashed var(--ink);
    display:flex; align-items:center; justify-content:center;
  }

  .popover{
    position:absolute; top:34px; right:14px; z-index:5;
    background:var(--paper); border:1.5px solid var(--ink);
    min-width:112px;
  }
  .popover .prow{ padding:8px 12px; }
  .popover .prow + .prow{ border-top:1px solid var(--ink); }

  /* ================= EDITOR ================= */
  .editor{ position:relative; height:100%; display:flex; flex-direction:column; }
  .bar{
    flex:0 0 auto; height:34px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 10px;
    border-bottom:1px solid var(--ink);
    position:relative; z-index:2; background:var(--paper);
  }
  .bar-group{ display:flex; align-items:center; gap:13px; }
  .counter{ font-size:var(--body); padding:2px 5px; }
  .counter.active{ background:var(--ink); color:var(--paper); }

  .bar.selection .bar-group.right{ gap:16px; }
  .bar .verb{ font-size:var(--body); }
  .bar .selection-label{ font-size:var(--body); }

  .canvas{ position:relative; flex:1; min-height:0; background:var(--paper); }
  .page-svg{ width:100%; height:100%; display:block; }
  .rule{ stroke:var(--muted); stroke-width:1; }
  .ink{ stroke:var(--ink); stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .lasso{ stroke:var(--ink); stroke-width:1.5; fill:none; stroke-dasharray:4 3; }

  .hidden-menu{
    position:absolute; top:10px; left:10px; z-index:4;
    display:inline-flex; align-items:center; justify-content:center;
    padding:4px;
  }

  /* panels */
  .panel{
    position:absolute; top:35px; z-index:5;
    background:var(--paper); border:1.5px solid var(--ink);
    padding:8px 0;
  }
  .panel .prow{ padding:7px 12px; display:flex; align-items:center; justify-content:space-between; }
  .panel .prow.plain{ display:block; }
  .panel .hr{ margin:6px 0; }

  /* tool panel */
  .tool-panel{ left:44px; width:236px; padding:10px 10px 12px; }
  .tool-row{ display:flex; gap:5px; }
  .tool-slot{
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid transparent;
  }
  .tool-slot.active{ background:var(--ink); }
  .tool-slot.active .icon{ color:var(--paper); stroke:var(--paper); }
  .tool-panel .hr{ margin:9px 0; }
  .swatch-row{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .swatch-row .label{ color:var(--muted); font-size:var(--caption); }
  .swatches{ display:flex; align-items:center; gap:6px; }
  .swatch{
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid transparent;
  }
  .swatch.selected{ border-color:var(--ink); }
  .dot{ border-radius:50%; background:var(--ink); }
  .dot.sm{ width:6px; height:6px; }
  .dot.md{ width:10px; height:10px; }
  .dot.lg{ width:14px; height:14px; }
  .sq{ width:14px; height:14px; }
  .sq.black{ background:var(--ink); }
  .sq.grey{ background:var(--muted); }
  .sq.white{ background:var(--paper); border:1px solid var(--ink); }
  .chip{ font-size:var(--caption); padding:2px 6px; }
  .chip.active{ background:var(--ink); color:var(--paper); }
  .chip-row{ display:flex; align-items:center; gap:4px; }
  .chip-sep{ color:var(--muted); font-size:var(--caption); }

  /* page panel */
  .page-panel{ left:64px; width:266px; padding:0 0 8px; }
  .page-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px; border-bottom:1px solid var(--ink);
  }
  .page-nav .side{ display:flex; align-items:center; gap:4px; }
  .page-thumbs{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 12px; border-bottom:1px solid var(--ink);
  }
  .page-thumb{
    width:28px; height:36px;
    border:1px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:var(--caption);
  }
  .page-thumb.current{
    background:var(--ink); color:var(--paper);
    outline:2px solid var(--ink); outline-offset:3px;
  }
  .page-actions{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px 0;
  }
  .page-actions .side{ display:flex; align-items:center; gap:5px; }

  /* more panel */
  .more-panel{ right:10px; width:196px; padding:6px 0; }
  .more-panel .prow{ padding:8px 12px; }

  /* quick find panel */
  .qf-panel{
    left:0; top:35px; bottom:0; width:196px;
    border-top:none; border-left:none;
    padding:12px;
    display:flex; flex-direction:column;
  }
  .qf-field{
    display:flex; align-items:center; gap:6px;
    padding-bottom:9px; margin-bottom:8px;
    border-bottom:1px solid var(--ink);
  }
  .qf-field .caret{ width:1.5px; height:14px; background:var(--ink); }
  .qf-results .prow{ padding:6px 2px; display:block; }
  .qf-results .prow.secondary{ color:var(--muted); }
  .qf-results .hr{ margin:7px 0; }

  @media (max-width:640px){
    header.page{ padding-top:32px; }
    .frames-grid{ padding-top:28px; gap:32px 20px; }
  }
</style>
</head>
<body>
